name: floodgate

services:
    redis:
        image: redis:latest
        ports:
            - '6379:6379'
        volumes:
            - redis-data:/data
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5
        environment:
            - REDIS_ARGS= --appendonly yes
    app:
      build: .
      ports:
          - '8080-8082:8080'
      deploy:
          replicas: 3
      depends_on:
          redis:
              condition: service_healthy
      environment:
          - REDIS_ADDR=redis:6379
    nginx:
        image: nginx:latest
        ports:
            - '80:80'
        depends_on:
            - app
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf

volumes:
    redis-data:
        driver: local